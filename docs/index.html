<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competencia Demo</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --border: #262b35;
    --text: #eef0f4;
    --muted: #8b93a3;
    --accent: #4fd1a5;
    --danger: #ef5b6f;
    --warn: #f2b84b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:hover td { background: var(--surface); }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .pill.active { background: #1e2a24; color: var(--accent); }
  .pill.qualified { background: #1e2a24; color: var(--accent); }
  .pill.disqualified { background: #2c1c20; color: var(--danger); }
  .gain-pos { color: var(--accent); font-weight: 600; }
  .gain-neg { color: var(--danger); font-weight: 600; }
  .reason { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .rank { color: var(--muted); width: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Competencia Demo — Ranking</h1>
  <p class="sub" id="updated">Cargando...</p>
  <table>
    <thead>
      <tr>
        <th class="rank">#</th>
        <th>Participante</th>
        <th>Ganancia</th>
        <th>Drawdown</th>
        <th>Trades</th>
        <th>Días</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>Aún no hay reportes. Esperando el primer envío del EA.</div>
</div>

<script>
const SUPABASE_URL = "https://giznhbantstjcksbjydg.supabase.co";
const ANON_KEY = "sb_publishable_C_9czjyd_ZTEG80rsFHL0Q_Z0to7IaX";

async function load() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?select=*`, {
      headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
    });
    const rows = await res.json();
    render(rows);
  } catch (e) {
    document.getElementById("updated").textContent = "Error cargando datos: " + e.message;
  }
}

function render(rows) {
  const tbody = document.getElementById("rows");
  const empty = document.getElementById("empty");
  tbody.innerHTML = "";

  const withData = rows.filter((r) => r.fetched_at);
  if (!withData.length) {
    empty.hidden = false;
    document.getElementById("updated").textContent = "";
    return;
  }
  empty.hidden = true;

  withData.forEach((r, i) => {
    const tr = document.createElement("tr");
    const gainClass = r.gain_pct >= 0 ? "gain-pos" : "gain-neg";
    tr.innerHTML = `
      <td class="rank">${i + 1}</td>
      <td>${r.name}</td>
      <td class="${gainClass}">${r.gain_pct?.toFixed(2)}%</td>
      <td>${r.drawdown_pct?.toFixed(2)}%</td>
      <td>${r.trades_count ?? "-"}</td>
      <td>${r.trading_days ?? "-"}</td>
      <td>
        <span class="pill ${r.status}">${label(r.status)}</span>
        ${r.disqualified_reason ? `<div class="reason">${r.disqualified_reason}</div>` : ""}
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("updated").textContent =
    "Última actualización: " + new Date().toLocaleTimeString();
}

function label(status) {
  return { active: "Activo", qualified: "Calificado", disqualified: "Descalificado" }[status] || status;
}

load();
setInterval(load, 30000); // refresca cada 30s
</script>
</body>
</html>
